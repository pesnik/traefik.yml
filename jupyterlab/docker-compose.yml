services:
  jupyter:
    # image: jupyter/base-notebook:latest
    build: .
    container_name: jupyter
    networks:
      - traefik_default
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=mysecrettoken
      - JUPYTERHUB_SERVICE_PREFIX=/
      - NOTEBOOK_ARGS=--NotebookApp.base_url=/ --MarimoProxyConfig.no_sandbox=True --MarimoProxyConfig.marimo_path=/opt/conda/bin/marimo --MarimoProxyConfig.host=127.0.0.1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jupyter.rule=Host(`jupyter.localhost`)"
      - "traefik.http.routers.jupyter.entrypoints=web"
      - "traefik.http.services.jupyter.loadbalancer.server.port=8888"

networks:
  traefik_default:
    external: true
